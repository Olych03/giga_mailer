[project]
name = "mailpilot"
version = "0.1.0"
description = "Локальный помощник по почте и календарю: ежедневная сводка, категории, черновики ответов с подтверждением"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
mailpilot = "mailpilot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailpilot"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
